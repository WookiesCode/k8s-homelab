apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homelab-overview.json: |
    {
      "title": "Homelab Overview",
      "uid": "adghlr6",
      "schemaVersion": 42,
      "version": 4,
      "panels": [
        {
          "title": "Network I/O by Pod",
          "type": "timeseries",
          "id": 4,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "binBps",
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(irate(container_network_receive_bytes_total{pod!=\"\"}[5m])) by (pod, namespace)",
              "legendFormat": "{{namespace}} / {{pod}} (Rx)",
              "refId": "Receive"
            },
            {
              "expr": "sum(irate(container_network_transmit_bytes_total{pod!=\"\"}[5m])) by (pod, namespace)",
              "legendFormat": "{{namespace}} / {{pod}} (Tx)",
              "refId": "Transmit"
            }
          ]
        },
        {
          "title": "Pod Restart Count",
          "type": "timeseries",
          "id": 3,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "bars", "fillOpacity": 80 }
            }
          },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace!=\"\"}) by (pod, namespace)",
              "legendFormat": "{{namespace}} / {{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Memory Usage by Pod",
          "type": "timeseries",
          "id": 2,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{container!=\"\"}) by (pod, namespace)",
              "legendFormat": "{{namespace}} / {{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "id": 1,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (pod, namespace)",
              "legendFormat": "{{namespace}} / {{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser"
    }
