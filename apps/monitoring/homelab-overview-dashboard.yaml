apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homelab-overview.json: |
    {
      "title": "Homelab Overview",
      "uid": "homelab-v5-final",
      "schemaVersion": 42,
      "version": 11,
      "panels": [
        { "title": "Network I/O", "type": "timeseries", "id": 1, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{ "expr": "sum(irate(container_network_receive_bytes_total{pod!=\"\"}[5m])) by (pod)", "refId": "A" }] },
        { "title": "Restarts", "type": "timeseries", "id": 2, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{ "expr": "sum(kube_pod_container_status_restarts_total) by (pod)", "refId": "A" }] },
        { "title": "Memory", "type": "timeseries", "id": 3, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{ "expr": "sum(container_memory_working_set_bytes) by (pod)", "refId": "A" }] },
        { "title": "CPU", "type": "timeseries", "id": 4, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{ "expr": "sum(rate(container_cpu_usage_seconds_total[5m])) by (pod)", "refId": "A" }] },
        { "title": "PVC Utilization", "type": "gauge", "id": 5, "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 }, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{ "expr": "sum(kubelet_volume_stats_used_bytes) by (persistentvolumeclaim) / sum(kubelet_volume_stats_capacity_bytes) by (persistentvolumeclaim) * 100", "refId": "A" }] }
      ]
    }
