# Flat structure to satisfy the schema
persistence:
  enabled: true
  existingClaim: n8n-pvc

# Inject database settings via extraEnv to ensure they take
extraEnv:
  - name: DB_TYPE
    value: postgresdb
  - name: DB_POSTGRESDB_HOST
    value: "postgres-svc.monitoring.svc.cluster.local"
  - name: DB_POSTGRESDB_DATABASE
    value: "n8n"
  - name: DB_POSTGRESDB_USER
    value: "n8n_user"
  - name: DB_POSTGRESDB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: n8n-secret
        key: db_password
  - name: N8N_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: n8n-secret
        key: encryption_key

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: n8n.lan
      paths:
        - path: /
          pathType: ImplementationSpecific
