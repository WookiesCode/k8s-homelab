n8n:
  # The schema is very picky: encryptionKey must be a simple string
  encryptionKey: "your-secret-encryption-key"

  # Correct mapping for version 1.16.37
  db:
    type: postgresdb
    postgresdb:
      host: "postgres-svc.monitoring.svc.cluster.local"
      database: "n8n"
      user: "n8n_user"
      # Using the secret reference here
      password:
        secretName: n8n-secret
        secretKey: db_password

  # Persistence must be under the main component
  main:
    persistence:
      enabled: true
      existingClaim: "n8n-pvc"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: n8n.lan
      paths:
        - path: /
          pathType: ImplementationSpecific
