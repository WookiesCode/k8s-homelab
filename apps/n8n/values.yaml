# Minimal config to bypass schema errors
n8n:
  encryptionKey: "a-temporary-key-for-initial-sync"

persistence:
  enabled: true
  storageClass: "longhorn"
  size: 10Gi

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: n8n.lan
      paths:
        - path: /
          pathType: ImplementationSpecific
