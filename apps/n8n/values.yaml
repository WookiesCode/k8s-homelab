n8n:
  config:
    database:
      type: postgresdb
      postgresdb:
        host: "postgres-svc.monitoring.svc.cluster.local"
        database: "n8n"
        user: "n8n_user"
        password:
          secretName: n8n-secret
          secretKey: db_password
    n8n:
      encryptionKey:
        secretName: n8n-secret
        secretKey: encryption_key

  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 10Gi

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: n8n.lan
        paths:
          - path: /
            pathType: ImplementationSpecific # Adding this to fix the 'pathType' error
