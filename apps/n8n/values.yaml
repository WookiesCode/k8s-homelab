n8n:
  config:
    database:
      type: postgresdb
      postgresdb:
        host: "your-postgres-svc.monitoring.svc.cluster.local" # Adjust based on your 'monitoring' folder DB
        database: "n8n"
        user: "n8n_user"
        password:
          secretName: n8n-secret
          secretKey: db_password
    n8n:
      encryptionKey:
        secretName: n8n-secret
        secretKey: encryption_key

  persistence:
    enabled: true
    storageClass: "longhorn" # Matches your existing storage
    size: 10Gi

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: n8n.local.home # Or whatever your internal domain is
        paths:
          - path: /
