n8n:
  encryptionKey: "your-secret-key" # Use a string here

  main:
    persistence:
      enabled: true
      existingClaim: "n8n-pvc"
    
    # Using extraEnv here forces these into the Pod's 'env' section
    # This overrides anything coming from 'envFrom' (the ConfigMap)
    extraEnv:
      - name: DB_TYPE
        value: "postgresdb"
      - name: DB_POSTGRESDB_HOST
        value: "postgres-svc.monitoring.svc.cluster.local"
      - name: DB_POSTGRESDB_DATABASE
        value: "n8n"
      - name: DB_POSTGRESDB_PORT
        value: "5432"
      - name: DB_POSTGRESDB_USER
        value: "n8n_user"
      - name: DB_POSTGRESDB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: n8n-secret
            key: db_password
      - name: N8N_ENCRYPTION_KEY
        valueFrom:
          secretKeyRef:
            name: n8n-secret
            key: encryption_key

ingress:
  enabled: true
  hosts:
    - host: n8n.lan
      paths:
        - path: /
          pathType: ImplementationSpecific
