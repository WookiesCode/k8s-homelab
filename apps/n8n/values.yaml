n8n:
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 10Gi

config:
  database:
    type: postgresdb
    postgresdb:
      host: "postgres-svc.monitoring.svc.cluster.local"
      database: "n8n"
      user: "n8n_user"
      password:
        secretName: n8n-secret
        secretKey: db_password
  encryptionKey:
    secretName: n8n-secret
    secretKey: encryption_key

persistence: # Keeping this here too just in case the chart reads from root
  enabled: true
  storageClass: "longhorn"
  size: 10Gi

ingress:
  enabled: true
  hosts:
    - host: n8n.lan
      paths:
        - path: /
          pathType: ImplementationSpecific
