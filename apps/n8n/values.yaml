n8n:
  # The schema requires this to be a string, not an object
  encryptionKey: "your-secret-encryption-key" 

  db:
    type: postgresdb
    # This version uses these specific nested keys
    externalPostgresql:
      host: "postgres-svc.monitoring.svc.cluster.local"
      database: "n8n"
      username: "n8n_user"
      password: "your_password"

  main:
    persistence:
      enabled: true
      existingClaim: "n8n-pvc"

  ingress:
    enabled: true
    hosts:
      - host: n8n.lan
        paths:
          - path: /
            pathType: ImplementationSpecific
