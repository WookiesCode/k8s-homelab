provisionDataStore:
  cassandra: false
  elasticsearch: false
  kafka: false

allInOne:
  enabled: true

storage:
  type: memory

collector:
  enabled: false

query:
  enabled: false

agent:
  enabled: false

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - host: jaeger.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: jaeger-tls
      hosts:
        - jaeger.local
