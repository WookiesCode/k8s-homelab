apiVersion: v1
kind: Namespace
metadata:
  name: k8s-docs

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-docs-html
  namespace: k8s-docs
data:
  index.html: |
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8s Home Lab</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #00d4ff;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }
  header { margin-bottom: 48px; border-bottom: 1px solid var(--border); padding-bottom: 32px; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-size: 36px; font-weight: 600; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); margin-top: 8px; font-size: 15px; font-weight: 300; }
  .cluster-info { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat { text-align: right; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .section-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .diagram { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; margin-bottom: 48px; }
  .layer { margin-bottom: 24px; }
  .layer-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 8px; padding-left: 4px; }
  .flow-layer { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .flow-arrow { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10px; margin: 4px 0; }
  .flow-arrow svg { opacity: 0.4; }
  .node { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 16px; border-radius: 8px; border: 1px solid; cursor: pointer; transition: all 0.2s ease; min-width: 120px; text-align: center; }
  .node:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .node.active { box-shadow: 0 0 0 2px var(--accent), 0 0 24px rgba(0,212,255,0.2); }
  .node-title { font-size: 13px; font-weight: 500; }
  .node-sub { font-size: 10px; opacity: 0.7; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
  .node-teal { background: rgba(13,148,136,0.1); border-color: rgba(13,148,136,0.4); color: #2dd4bf; }
  .node-teal:hover, .node-teal.active { background: rgba(13,148,136,0.2); border-color: #0d9488; }
  .node-purple { background: rgba(124,58,237,0.1); border-color: rgba(124,58,237,0.4); color: #a78bfa; }
  .node-purple:hover, .node-purple.active { background: rgba(124,58,237,0.2); border-color: #7c3aed; }
  .node-amber { background: rgba(217,119,6,0.1); border-color: rgba(217,119,6,0.4); color: #fcd34d; }
  .node-amber:hover, .node-amber.active { background: rgba(217,119,6,0.2); border-color: #d97706; }
  .node-blue { background: rgba(37,99,235,0.1); border-color: rgba(37,99,235,0.4); color: #60a5fa; }
  .node-blue:hover, .node-blue.active { background: rgba(37,99,235,0.2); border-color: #2563eb; }
  .node-green { background: rgba(5,150,105,0.1); border-color: rgba(5,150,105,0.4); color: #34d399; }
  .node-green:hover, .node-green.active { background: rgba(5,150,105,0.2); border-color: #059669; }
  .node-coral { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.4); color: #f87171; }
  .node-coral:hover, .node-coral.active { background: rgba(220,38,38,0.2); border-color: #dc2626; }
  .node-device { background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.3); color: var(--accent); }
  .node-device:hover, .node-device.active { background: rgba(0,212,255,0.15); border-color: var(--accent); }
  .detail-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 48px; display: none; animation: fadeIn 0.2s ease; }
  .detail-panel.visible { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .panel-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .panel-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .panel-title { font-size: 20px; font-weight: 600; }
  .panel-tag { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
  .panel-close { background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px; transition: all 0.2s; }
  .panel-close:hover { border-color: var(--accent); color: var(--accent); }
  .panel-desc { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 20px; font-weight: 300; }
  .panel-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .meta-item { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); background: var(--surface2); padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border); }
  .meta-item span { color: var(--text); }
  .panel-url { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); display: inline-block; margin-top: 4px; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
  .panel-url:hover { border-color: var(--accent); }
  .nodes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 48px; }
  .node-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .node-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 6px; }
  .node-role { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .spec-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; margin-bottom: 3px; }
  .spec-key { color: var(--muted); }
  .spec-val { color: var(--text); }
  footer { border-top: 1px solid var(--border); padding-top: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .footer-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .footer-link { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); text-decoration: none; }
  .footer-link:hover { text-decoration: underline; }
  @media (max-width: 640px) { .nodes-grid { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 26px; } .stat { text-align: left; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div>
        <div class="logo">// kubernetes home lab</div>
        <h1>k8s <span>cluster</span></h1>
        <p class="subtitle">Production-grade home lab running on Proxmox VMs</p>
      </div>
      <div class="cluster-info">
        <div class="stat"><div class="stat-value">4</div><div class="stat-label">Nodes</div></div>
        <div class="stat"><div class="stat-value">v1.32</div><div class="stat-label">K8s version</div></div>
        <div class="stat"><div class="stat-value">12+</div><div class="stat-label">Apps deployed</div></div>
      </div>
    </div>
  </header>

  <div class="section-label">Architecture — click any component to learn more</div>
  <div class="diagram">
    <div class="layer">
      <div class="layer-label">// your devices</div>
      <div class="flow-layer">
        <div class="node node-device" onclick="showPanel('devices')"><span class="node-title">Your devices</span><span class="node-sub">Mac / browser</span></div>
      </div>
    </div>
    <div class="flow-arrow"><svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0v16M2 10l6 8 6-8" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span>DNS / hosts file → 192.168.1.186</span></div>
    <div class="layer">
      <div class="layer-label">// networking</div>
      <div class="flow-layer">
        <div class="node node-teal" onclick="showPanel('metallb')"><span class="node-title">MetalLB</span><span class="node-sub">load balancer</span></div>
        <div class="node node-teal" onclick="showPanel('ingress')"><span class="node-title">ingress-nginx</span><span class="node-sub">reverse proxy</span></div>
        <div class="node node-teal" onclick="showPanel('certmanager')"><span class="node-title">cert-manager</span><span class="node-sub">TLS certs</span></div>
      </div>
    </div>
    <div class="flow-arrow"><svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0v16M2 10l6 8 6-8" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span>routes by hostname</span></div>
    <div class="layer">
      <div class="layer-label">// applications</div>
      <div class="flow-layer">
        <div class="node node-purple" onclick="showPanel('homepage')"><span class="node-title">Homepage</span><span class="node-sub">home.lan</span></div>
        <div class="node node-purple" onclick="showPanel('uptimekuma')"><span class="node-title">Uptime Kuma</span><span class="node-sub">uptime-kuma.lan</span></div>
        <div class="node node-purple" onclick="showPanel('vaultwarden')"><span class="node-title">Vaultwarden</span><span class="node-sub">vaultwarden.lan</span></div>
        <div class="node node-purple" onclick="showPanel('nextcloud')"><span class="node-title">Nextcloud</span><span class="node-sub">nextcloud.lan</span></div>
      </div>
    </div>
    <div class="flow-arrow"><svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0v16M2 10l6 8 6-8" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span>persistent data</span></div>
    <div class="layer">
      <div class="layer-label">// storage</div>
      <div class="flow-layer">
        <div class="node node-amber" onclick="showPanel('longhorn')"><span class="node-title">Longhorn</span><span class="node-sub">replicated</span></div>
        <div class="node node-amber" onclick="showPanel('localpath')"><span class="node-title">local-path</span><span class="node-sub">node-local</span></div>
        <div class="node node-amber" onclick="showPanel('velero')"><span class="node-title">Velero + Minio</span><span class="node-sub">backups</span></div>
      </div>
    </div>
    <div class="flow-arrow"><svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0v16M2 10l6 8 6-8" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span>metrics / logs / traces</span></div>
    <div class="layer">
      <div class="layer-label">// observability</div>
      <div class="flow-layer">
        <div class="node node-blue" onclick="showPanel('prometheus')"><span class="node-title">Prometheus</span><span class="node-sub">metrics</span></div>
        <div class="node node-blue" onclick="showPanel('loki')"><span class="node-title">Loki + Promtail</span><span class="node-sub">logs</span></div>
        <div class="node node-blue" onclick="showPanel('jaeger')"><span class="node-title">Jaeger</span><span class="node-sub">traces</span></div>
        <div class="node node-blue" onclick="showPanel('grafana')"><span class="node-title">Grafana</span><span class="node-sub">grafana.lan</span></div>
      </div>
    </div>
    <div class="flow-arrow"><svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0v16M2 10l6 8 6-8" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span>git push → auto deploy</span></div>
    <div class="layer">
      <div class="layer-label">// gitops & infrastructure</div>
      <div class="flow-layer">
        <div class="node node-coral" onclick="showPanel('argocd')"><span class="node-title">ArgoCD</span><span class="node-sub">argocd.lan</span></div>
        <div class="node node-green" onclick="showPanel('sealedsecrets')"><span class="node-title">Sealed Secrets</span><span class="node-sub">encrypted</span></div>
        <div class="node node-green" onclick="showPanel('terraform')"><span class="node-title">Terraform</span><span class="node-sub">proxmox VMs</span></div>
        <div class="node node-green" onclick="showPanel('headlamp')"><span class="node-title">Headlamp</span><span class="node-sub">headlamp.lan</span></div>
      </div>
    </div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="panel-header">
      <div class="panel-dot" id="panel-dot"></div>
      <span class="panel-title" id="panel-title"></span>
      <span class="panel-tag" id="panel-tag"></span>
      <button class="panel-close" onclick="closePanel()">✕ close</button>
    </div>
    <p class="panel-desc" id="panel-desc"></p>
    <div class="panel-meta" id="panel-meta"></div>
    <a class="panel-url" id="panel-url" href="#" target="_blank"></a>
  </div>

  <div class="section-label">Cluster nodes</div>
  <div class="nodes-grid">
    <div class="node-card"><div class="node-name">k8s-controller</div><div class="node-role">Control plane</div><div class="spec-row"><span class="spec-key">CPU</span><span class="spec-val">4 vCPU</span></div><div class="spec-row"><span class="spec-key">RAM</span><span class="spec-val">4 GB</span></div><div class="spec-row"><span class="spec-key">Disk</span><span class="spec-val">50 GB</span></div></div>
    <div class="node-card"><div class="node-name">k8s-worker1</div><div class="node-role">Worker</div><div class="spec-row"><span class="spec-key">CPU</span><span class="spec-val">4 vCPU</span></div><div class="spec-row"><span class="spec-key">RAM</span><span class="spec-val">8 GB</span></div><div class="spec-row"><span class="spec-key">Disk</span><span class="spec-val">150 GB</span></div></div>
    <div class="node-card"><div class="node-name">k8s-worker2</div><div class="node-role">Worker</div><div class="spec-row"><span class="spec-key">CPU</span><span class="spec-val">4 vCPU</span></div><div class="spec-row"><span class="spec-key">RAM</span><span class="spec-val">8 GB</span></div><div class="spec-row"><span class="spec-key">Disk</span><span class="spec-val">150 GB</span></div></div>
    <div class="node-card"><div class="node-name">k8s-worker3</div><div class="node-role">Worker</div><div class="spec-row"><span class="spec-key">CPU</span><span class="spec-val">4 vCPU</span></div><div class="spec-row"><span class="spec-key">RAM</span><span class="spec-val">8 GB</span></div><div class="spec-row"><span class="spec-key">Disk</span><span class="spec-val">150 GB</span></div></div>
  </div>

  <footer>
    <span class="footer-text">// k8s home lab — proxmox + ubuntu + kubernetes v1.32</span>
    <a href="https://github.com/WookiesCode/k8s-homelab" class="footer-link" target="_blank">github.com/WookiesCode/k8s-homelab →</a>
  </footer>
</div>

<script>
const components = {
  devices: { title: 'Your devices', tag: 'client', color: '#00d4ff', desc: 'Any device on your home network — Mac, phone, tablet. To reach cluster apps, your device needs to resolve hostnames like home.lan to 192.168.1.186. Currently done via your hosts file, but can be configured on your UDM Pro as a wildcard DNS record.', meta: [['hosts file', '192.168.1.186'], ['future', 'UDM Pro wildcard DNS']] },
  metallb: { title: 'MetalLB', tag: 'networking', color: '#0d9488', desc: 'Bare-metal load balancer. On cloud providers like AWS or GCP, Kubernetes automatically gets a real IP when you create a LoadBalancer service. On bare metal there is no cloud to do that — MetalLB fills the gap by assigning real IPs from your home network.', meta: [['namespace', 'metallb-system'], ['IP assigned', '192.168.1.186']] },
  ingress: { title: 'ingress-nginx', tag: 'networking', color: '#0d9488', desc: 'Reverse proxy and ingress controller. Sits at 192.168.1.186 and routes all incoming traffic to the correct app based on hostname. All apps share one IP — ingress-nginx figures out which pod gets the request by reading the Host header.', meta: [['namespace', 'ingress-nginx'], ['IP', '192.168.1.186'], ['ports', '80, 443']] },
  certmanager: { title: 'cert-manager', tag: 'networking', color: '#0d9488', desc: 'Automatic TLS certificate management. Watches for Ingress resources and automatically issues and renews certificates. Currently using self-signed certificates via a ClusterIssuer — browser will show a warning but all traffic is encrypted.', meta: [['namespace', 'cert-manager'], ['issuer', 'selfsigned'], ['version', 'v1.17.2']] },
  homepage: { title: 'Homepage', tag: 'app', color: '#7c3aed', desc: 'Self-hosted dashboard showing links to all your apps. Configured via YAML files stored in a PVC inside the container. Supports icons, live status indicators, and custom grouping by category.', meta: [['namespace', 'homepage'], ['config', 'services.yaml in PVC']], url: 'https://home.lan' },
  uptimekuma: { title: 'Uptime Kuma', tag: 'app', color: '#7c3aed', desc: 'Service uptime monitoring. Monitors all your apps via internal cluster DNS. Internal monitors use svc.cluster.lan URLs rather than .lan hostnames since pods use Kubernetes internal DNS, not your hosts file.', meta: [['namespace', 'uptime-kuma'], ['storage', '1Gi PVC'], ['version', '2.2.1']], url: 'https://uptime-kuma.lan' },
  vaultwarden: { title: 'Vaultwarden', tag: 'app', color: '#7c3aed', desc: 'Self-hosted password manager compatible with all Bitwarden clients. Signups are disabled after initial account creation. Your passwords never leave your home network. Use the Bitwarden browser extension pointing at vaultwarden.lan.', meta: [['namespace', 'vaultwarden'], ['image', 'vaultwarden/server:1.32.7'], ['signups', 'disabled']], url: 'https://vaultwarden.lan' },
  nextcloud: { title: 'Nextcloud', tag: 'app', color: '#7c3aed', desc: 'Self-hosted cloud storage with a PostgreSQL backend. Two deployments work together — Nextcloud finds the database via internal DNS (nextcloud-db.nextcloud.svc.cluster.lan). Credentials stored in a Sealed Secret.', meta: [['namespace', 'nextcloud'], ['db', 'PostgreSQL 16'], ['data', '10Gi PVC'], ['db storage', '5Gi PVC']], url: 'https://nextcloud.lan' },
  longhorn: { title: 'Longhorn', tag: 'storage', color: '#d97706', desc: 'Production-grade replicated storage. The default storage class. Data is replicated across 2 worker nodes — if a worker VM goes down your data survives. Includes a web UI, snapshots, and volume management.', meta: [['namespace', 'longhorn-system'], ['replicas', '2'], ['default', 'yes']], url: 'https://longhorn.lan' },
  localpath: { title: 'local-path-provisioner', tag: 'storage', color: '#d97706', desc: 'Simple node-local storage. Data is tied to whichever node the pod runs on — if that node goes down, data is inaccessible. Good for non-critical data. Longhorn is preferred for anything important.', meta: [['namespace', 'local-path-storage'], ['reclaim', 'Delete'], ['default', 'no']] },
  velero: { title: 'Velero + Minio', tag: 'storage', color: '#d97706', desc: 'Cluster backup and restore. Velero backs up all Kubernetes resources to Minio, a self-hosted S3-compatible storage server on the Docker VM. Daily backups run at 2AM with 30-day retention.', meta: [['schedule', '0 2 * * *'], ['retention', '30 days'], ['backend', 'Minio @ 192.168.1.150']] },
  prometheus: { title: 'Prometheus', tag: 'observability', color: '#2563eb', desc: 'Metrics collection and time-series storage. Scrapes CPU, memory, network, and application metrics from all nodes and pods. The first pillar of observability — answers "is my system healthy?"', meta: [['namespace', 'monitoring'], ['retention', '7 days'], ['storage', '10Gi']] },
  loki: { title: 'Loki + Promtail', tag: 'observability', color: '#2563eb', desc: 'Log aggregation. Promtail runs as a DaemonSet on every node and ships all pod logs to Loki. Search logs from every app in one place via Grafana. The second pillar — answers "what happened?"', meta: [['namespace', 'monitoring'], ['mode', 'SingleBinary'], ['version', '3.6.7']] },
  jaeger: { title: 'Jaeger', tag: 'observability', color: '#2563eb', desc: 'Distributed tracing. Tracks a single request through multiple services, showing where time was spent. The third pillar — answers "why did it happen?" Apps need OpenTelemetry instrumentation to send traces.', meta: [['namespace', 'jaeger'], ['storage', 'in-memory'], ['OTLP gRPC', 'port 4317']], url: 'https://jaeger.lan' },
  grafana: { title: 'Grafana', tag: 'observability', color: '#2563eb', desc: 'Visualization dashboard. Reads from Prometheus (metrics) and Loki (logs). Pre-built Kubernetes dashboards show cluster health, node resources, and pod metrics out of the box.', meta: [['namespace', 'monitoring'], ['sources', 'Prometheus, Loki']], url: 'https://grafana.lan' },
  argocd: { title: 'ArgoCD', tag: 'gitops', color: '#dc2626', desc: 'GitOps continuous deployment. Watches your GitHub repo and automatically syncs the cluster when changes are pushed. Git is the single source of truth — every change is audited and drift is automatically corrected.', meta: [['namespace', 'argocd'], ['repo', 'WookiesCode/k8s-homelab'], ['sync', 'automatic']], url: 'https://argocd.lan' },
  sealedsecrets: { title: 'Sealed Secrets', tag: 'security', color: '#059669', desc: 'Encrypts Kubernetes secrets so they can be safely committed to a public GitHub repo. Uses asymmetric encryption — the private key never leaves the cluster. Only your cluster can decrypt them.', meta: [['namespace', 'kube-system'], ['tool', 'kubeseal CLI'], ['version', '0.36.6']] },
  terraform: { title: 'Terraform', tag: 'iac', color: '#059669', desc: 'Infrastructure as Code for Proxmox. Declare VMs in HCL files, run terraform apply, and they appear in Proxmox. The same pattern works for AWS, GCP, and Azure.', meta: [['version', '1.10.5'], ['provider', 'bpg/proxmox v0.73.2'], ['target', '192.168.1.91']] },
  headlamp: { title: 'Headlamp', tag: 'ui', color: '#059669', desc: 'Kubernetes web UI. Official replacement for the retired Kubernetes Dashboard (archived Jan 2026), now under Kubernetes sig-ui in the CNCF. Browse pods, deployments, services, logs, and events without kubectl.', meta: [['namespace', 'headlamp'], ['auth', 'bearer token']], url: 'https://headlamp.lan' },
};

let activeNode = null;

function showPanel(id) {
  const data = components[id];
  if (!data) return;
  if (activeNode) activeNode.classList.remove('active');
  document.querySelectorAll('.node').forEach(n => {
    if (n.getAttribute('onclick') === `showPanel('${id}')`) { n.classList.add('active'); activeNode = n; }
  });
  document.getElementById('panel-dot').style.background = data.color;
  document.getElementById('panel-title').textContent = data.title;
  document.getElementById('panel-tag').textContent = data.tag;
  document.getElementById('panel-desc').textContent = data.desc;
  document.getElementById('panel-meta').innerHTML = data.meta.map(([k,v]) => `<div class="meta-item">${k}: <span>${v}</span></div>`).join('');
  const urlEl = document.getElementById('panel-url');
  if (data.url) { urlEl.textContent = data.url; urlEl.href = data.url; urlEl.style.display = 'inline-block'; } else { urlEl.style.display = 'none'; }
  const panel = document.getElementById('detail-panel');
  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('visible');
  if (activeNode) { activeNode.classList.remove('active'); activeNode = null; }
}
</script>
</body>
</html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-docs
  namespace: k8s-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-docs
  template:
    metadata:
      labels:
        app: k8s-docs
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: k8s-docs-html

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-docs
  namespace: k8s-docs
spec:
  selector:
    app: k8s-docs
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-docs
  namespace: k8s-docs
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - k8s-docs.lan
      secretName: k8s-docs-tls
  rules:
    - host: k8s-docs.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-docs
                port:
                  number: 80
